name: Refresh gallery

# Regenera la galería de indicadores con datos frescos de Yahoo Finance.
# Los runners de GitHub tienen internet, así que yfinance funciona aquí.
# Disparo manual desde la pestaña Actions (workflow_dispatch) o schedule semanal.

on:
  schedule:
    - cron: "0 6 * * 1"   # cada lunes, 06:00 UTC
  workflow_dispatch:
    inputs:
      ticker:
        description: "Símbolo a graficar (Yahoo Finance)"
        default: "MSTR"

permissions:
  contents: write

env:
  MPLBACKEND: Agg   # matplotlib sin display

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Generar galería (yfinance real)
        run: python src/gallery.py --ticker "${{ github.event.inputs.ticker || 'MSTR' }}" --period 5y --interval 1wk --no-synthetic

      - name: Commitear si hay cambios
        run: |
          git config user.name "Bernard Balbontín"
          git config user.email "107295900+bbalbo@users.noreply.github.com"
          git add figures/*.png
          if git diff --cached --quiet; then
            echo "Sin cambios en la galería."
          else
            git commit -m "gallery: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
